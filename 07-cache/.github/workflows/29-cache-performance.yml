name: Cache Performance Comparison

on:
  workflow_dispatch:

jobs:
  without-cache:
    name: Install without cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Time npm ci
        id: install
        timeout-minutes: 5
        run: |
          START=$(date +%s%N)
          npm ci --no-audit --no-fund
          END=$(date +%s%N)
          echo "Install took $(( (END - START) / 1000000 )) ms"

  with-cache:
    name: Install with cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Time npm ci
        timeout-minutes: 5
        run: |
          START=$(date +%s%N)
          npm ci --no-audit --no-fund
          END=$(date +%s%N)
          echo "Install took $(( (END - START) / 1000000 )) ms"
      - name: Compare
        run: |
          echo "Compare the two job durations in the run summary."
          echo "The cached job should install dependencies significantly faster."
name: Use Secret

on:
  workflow_dispatch:

jobs:
  use-secret:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      # Add the API_KEY secret under:
      # Settings > Secrets and variables > Actions > New repository secret
      - name: Use the secret without exposing it
        run: |
          if [ -n "$API_KEY" ]; then
            echo "API_KEY is configured ✓ (value stays masked, never printed)"
          else
            echo "API_KEY is NOT set. Add it in repository secrets."
            exit 1
          fi
name: Render Deploy with Secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Create these secrets: Settings > Secrets and variables > Actions
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Verify secrets are present (values never printed)
        run: |
          [ -n "$RENDER_SERVICE_ID" ] && echo "RENDER_SERVICE_ID: set"
          [ -n "$RENDER_API_KEY" ] && echo "RENDER_API_KEY: set"
          [ -n "$RENDER_DEPLOY_HOOK" ] && echo "RENDER_DEPLOY_HOOK: set"

      - name: Trigger deploy via render.com API
        run: |
          curl --fail --silent --show-error -L \
            --request POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}'
          echo "Render deployment started"
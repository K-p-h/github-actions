name: Docker Build and Test

on:
  push:
  pull_request:

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run tests inside a dependency container
        run: docker run --rm -v "$PWD":/app -w /app node:20-alpine sh -c "npm ci --no-audit --no-fund && npm test"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ github.repository }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the built image and smoke-test it
        run: |
          docker run -d --name nextjs-smoke -p 3000:3000 ${{ github.repository }}:test
          sleep 5
          curl --fail http://localhost:3000 && echo "✔ Container is healthy"
          docker rm -f nextjs-smoke